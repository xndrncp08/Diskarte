# Render Blueprint — 1-click free deployment of the Diskarte web container and its
# Early Access portal (waitlist + admin review), both from this repository.
# Dashboard → New → Blueprint → pick this repo. You'll be prompted for the secret values below.
services:
  - type: web
    name: diskarte
    runtime: docker
    plan: free
    region: singapore # closest Render region to the Philippines
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Supabase (Project Settings → API)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # LiveKit Cloud (Settings → Keys)
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Optional: comma-separated Supabase OAuth providers you enabled
      - key: AUTH_OAUTH_PROVIDERS
        value: github,google
      # SITE_URL defaults to RENDER_EXTERNAL_URL; set it when you add a custom domain.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Early Access: `invite` closes public sign-up and links /signup to the portal below.
      - key: SIGNUP_MODE
        value: invite
      - key: EARLY_ACCESS_URL
        fromService:
          name: diskarte-early-access
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: diskarte-early-access
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./early-access-portal/Dockerfile
    dockerContext: ./early-access-portal
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - early-access-portal/**
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Server-only; used exclusively to create accounts for approved applicants.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_URL
        fromService:
          name: diskarte
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORTAL_SECRET
        generateValue: true
      - key: EMAIL_TRANSPORT
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional Cloudflare Turnstile
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
