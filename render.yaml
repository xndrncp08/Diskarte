# Render Blueprint — 1-click free deployment of the Diskarte app (diskarte/) as a Docker web
# service. The Early Access portal (early-access-portal/) deploys to Vercel instead — see
# early-access-portal/DEPLOYMENT.md.
# Dashboard → New → Blueprint → pick this repo. You'll be prompted for the secret values below.
services:
  - type: web
    name: diskarte
    runtime: docker
    plan: free
    region: singapore # closest Render region to the Philippines
    # npm workspace: build from the repository root with the app's Dockerfile.
    dockerfilePath: ./diskarte/Dockerfile
    dockerContext: .
    buildFilter:
      paths:
        - diskarte/**
        - package.json
        - package-lock.json
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Supabase (Project Settings → API)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # LiveKit Cloud (Settings → Keys)
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Optional: comma-separated Supabase OAuth providers you enabled
      - key: AUTH_OAUTH_PROVIDERS
        value: github,google
      # SITE_URL defaults to RENDER_EXTERNAL_URL; set it when you add a custom domain.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Early Access: `invite` closes public sign-up and links /signup to the portal below.
      - key: SIGNUP_MODE
        value: invite
      # The Vercel URL of the Early Access portal (e.g. https://early.diskarte.ph)
      - key: EARLY_ACCESS_URL
        sync: false
