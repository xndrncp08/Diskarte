# Supabase CLI configuration for local development and CI (`supabase start`).
# Hosted projects are configured in the dashboard — see DEPLOYMENT.md.
project_id = "diskarte"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
# Mirrors passwordSchema in src/lib/profile.ts.
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
# Local/CI: E2E suites create many users from one IP.
sign_in_sign_ups = 300
email_sent = 100

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local/CI only: skip inbox confirmation so E2E sign-ups can log straight in.
enable_confirmations = false

[auth.external.github]
enabled = false
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true
